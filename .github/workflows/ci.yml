# Etch CI: the backend's unit tests (no KiCad needed), lint, and the pages' browser tests in mock mode.
# The engine's own tests need KiCad's libraries on disk, so they run on the host Mac, not here.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    name: backend tests + ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --project engine --frozen
      - run: engine/.venv/bin/ruff check --line-length 120 deploy/views.py deploy/tests/test_views.py deploy/tests/fixtures/make_mock_views.py
      - run: engine/.venv/bin/python -m unittest discover -s deploy/tests
      - name: the editor's mock views match the fixture run
        run: |
          engine/.venv/bin/python deploy/tests/fixtures/make_mock_views.py
          git diff --exit-code -- deploy/etch-app/fixtures/views
  e2e:
    name: browser tests (mock mode)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: deploy/tests/e2e
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
        env:
          CI: "1"
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: deploy/tests/e2e/playwright-report
          retention-days: 7
